<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>

    <style>
        body{
            background-color: #f2f2f2;
        }
        
        #lol{
            color: aqua;
        }

        #xd{
            color: rgb(210, 240, 255);
        }

        #acer{
            color: hsl(180, 50%, 80%);
        }


    </style>
</head>
<body id="blue">

    <h1 align="center">Recibo Telefonico</h1>

<form action="">
    <label for="">Minutos de llamadas a celular:(1.00c/u)</label>
    <input type="number" name="" id="">

    <hr>

    <h2 id="lol">Tipo de Plan</h2>
    <input type="radio" name="" id="">
    Solo Telefono
    <br>
    <input type="radio" name="" id="">
    Telefono + Internet (450,000)
    <br>
    <input type="radio" name="" id="">
    Telefono + Internet + TV (850,000)
    
    <hr>

    <h2 id="xd">Otros Servicios</h2>
    <input type="checkbox" name="" id="">
    Antivirus (30,000)
    <br>
    <input type="checkbox" name="" id="">
    Servicios de nube (50,00)
    <br>
    <input type="checkbox" name="" id="">
    Servicios web (40,000)

    <hr>

    <h2 id="acer">Paquetes</h2>
     <select name="" id="">
        <option value="">Residencial</option>
        <option value="">PYMES</option>
        <option value="">Empresas</option>

     </select>

    <hr>

    <button>Calcular Recibo</button>
</form>

</body>
</html>
